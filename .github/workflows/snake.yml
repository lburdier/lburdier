name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7a9080&color_dots=#ebedf0,#c9d4dc,#a7b7c3,#8fa0b0,#5f7180
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8fa0b0&color_dots=#161b22,#2a3640,#44545f,#6b7d89,#8fa0b0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
